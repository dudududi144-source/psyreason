<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>PsyReason</title>
  <script>
    // Redirect to the assets directory where the app is served
    var base = "/psyreason/";
    var path = window.location.pathname;
    if (path === base || path === base.slice(0, -1)) {
      window.location.replace(base + "assets/");
    } else {
      window.location.replace(base + "assets/");
    }
  </script>
</head>
<body>
  <h1>Redirecting to PsyReason...</h1>
  <p>If not redirected, <a href="/psyreason/assets/">click here</a>.</p>
</body>
</html>
